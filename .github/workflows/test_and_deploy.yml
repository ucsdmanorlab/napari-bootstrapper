# This workflow runs the tests and uses Twine to upload the Python package
# when someone creates a release.
# For more information, see https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: tests

on:
  push:
    branches:
      - main
      - npe2
    tags:
      - "v*" # push events for tags that match v*, such as v1.0 and v20.15.10
  pull_request:
    branches:
      - main
      - npe2
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyqt5
      CUDA_VISIBLE_DEVICES: ""
      NUMBA_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # These libraries let the tests use Qt on Linux.
      - uses: tlambert03/setup-qt-libs@v1

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv pip install --system --torch-backend cpu ".[testing]"

      - name: Test
        run: python -m pytest tests -v --cov=napari_bootstrapper --cov-report=xml

      - name: Coverage
        uses: codecov/codecov-action@v3

  deploy:
    # This job runs when you push a tag that matches "v*". It needs your
    # Twine API key in the TWINE_API_KEY GitHub secret (see the README for
    # details).
    needs: [test]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools setuptools_scm wheel twine build
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}
        run: |
          git tag
          python -m build .
          twine upload dist/*
