# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{312,313}-{linux,macos,windows}
isolated_build=true

[gh-actions]
python =
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
setenv =
    QT_QPA_PLATFORM = offscreen
    QT_API = pyqt5
    CUDA_VISIBLE_DEVICES =
    NUMBA_NUM_THREADS = 2
    OMP_NUM_THREADS = 2
extras =
    testing
commands =
    python -m pytest {posargs:tests} -v --cov=napari_bootstrapper --cov-report=xml
